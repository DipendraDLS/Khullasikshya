{% extends 'login_signup/base.html' %}

{% load static %}




{% block body %}

    <body class="form-v6">
    <div class="page-content">
        <div class="form-v6-content">

            <div class="form-left">
                <img src="{% static 'login_signup/images/book.jpg' %}" alt="form" width="484" height="588">
            </div>
            <form class="form-detail" action="" method="POST">
                {% csrf_token %}
                <a href="/"><img src="{% static 'images/logo_black.png' %}" width="150"></a>

                <h2>Register Form</h2>
                <div class="form-row">
                    <i class="fa fa-user fa-lg icon"></i>
                    <input type="text" name="username" id="username" class="input-text" placeholder="Username" required
                           value="{% if form.username.value %}{{ form.username.value }}{% endif %}">
                </div>
                <div class="form-row">
                    <i class="fa fa-envelope fa-lg icon"></i>
                    <input type="email" name="email" id="email" class="input-text " placeholder="Email Address" required
                           value="{% if form.email.value %}{{ form.email.value }}{% endif %}">
                </div>
                <div class="form-row">
                    <i class="fa fa-unlock-alt fa-lg icon"></i>
                    <input type="password" name="password1" id="id_password1" class="input-text" placeholder="Password"
                           required>

                    <span toggle="#id_password1" class="fa fa-fw fa-lg fa-eye field-icon toggle-password"
                          title="show password"></span>

                </div>
                <div class="form-row">
                    <i class="fa fa-lock fa-lg icon"></i>
                    <input type="password" name="password2" id="id_password2" class="input-text"
                           placeholder="Comfirm Password" required>

                    <span toggle="#id_password2" class="fa fa-fw fa-eye fa-lg field-icon toggle-password"
                          title="show password"></span>

                </div>


                {% if form.errors %}
                    <script>
                        Swal.fire(
                            'Something went wrong!',
                            '<span style="color:red">{{ form.errors.password2 }}</span>',
                            'error'
                        )
                    </script>

                {% endif %}

                {% if form.non_field_errors %}
                    <script>
                        Swal.fire(
                            'Something went wrong!',
                            '<span style="color:red">{{ form.non_field_errors }}</span>',
                            'error'
                        )
                    </script>
                {% endif %}

                <div class="form-row-last">
                    <input type="submit" name="register" class="register" value="Signup">
                </div>
                <a href="{% url 'login' %}" style="text-decoration: none; color: #0088CC;"> Already have an account?</a>

            </form>


        </div>
    </div>


{% endblock %}
