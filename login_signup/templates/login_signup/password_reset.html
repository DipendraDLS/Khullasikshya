{% extends 'login_signup/base.html' %}


{% load static %}


{% block body %}
    <body class="form-v6">
    <div class="page-content">
        <div class="form-v6-content">
            <div class="form-left">
                <img src="{% static 'login_signup/images/book.jpg' %}" alt="form" width="484" height="569">
            </div>
            <form class="form-detail" action="" method="post">
                {% csrf_token %}

                <div style="margin-top: 50px">
                    <a href="/">
                        <img src="{% static 'images/logo_black.png' %}" width="200">
                    </a>
                </div>

                <h2 class="font-weight-bold" style="margin-top: 89px">Password Reset Form</h2>


                <div class="form-row">
                    <i class="fa fa-envelope fa-lg icon"></i>
                    <input type="text" name="email" id="email" class="input-text" placeholder="Enter valid email"
                           required
                    >
                </div>


                <div class="form-row-last" style="margin-top: 20px; margin-bottom: 24px">

                    <input type="submit" name="register" class="register" value="Submit">


                </div>

                <div style="color: black;"> Back to login?
                    <a href="{% url 'login' %}" style="text-decoration: none; color: #0088CC"> Login</a>
                </div>

            </form>


        </div>
    </div>


{% endblock %}
