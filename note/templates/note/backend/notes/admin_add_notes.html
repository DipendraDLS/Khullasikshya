<!-- Add Note Modal-->
<div class="modal fade" id="addNotesModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
     aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="exampleModalLabel">Add Subject</h5>
                <button class="close" type="button" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">×</span>
                </button>
            </div>
            <div class="modal-body">
                <form action="{% url 'adminAddNotes' %}" method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    <input type="hidden" name="redirect_subject_id" value="{{ subject.id }}">
                    <div class="form-group">
                        <label for="note_name">Note Title</label>
                        {{ note_form.note_title }}
                    </div>

                    <div class="form-group">
                        <label for="note_description">Description</label>
                        {{ note_form.note_description }}
                    </div>
                    <div class="form-group">
                        <label for="document">Upload Document</label>
                        {{ note_form.document }}

                    </div>

                    <div class="form-group">
                        <label for="Subject Name">Select Subject</label>
                        <select class="form-control my-select" data-show-subtext="true" data-live-search="true"
                                id="subject_name"
                                name="subject_name" required>
                            <option value="{{ subject.id }}">{{ subject.subject_name }}</option>

                        </select>
                    </div>


                    <div class="modal-footer">
                        <button class="btn btn-secondary" type="button" data-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Add Note</button>
                    </div>
                </form>

            </div>

        </div>
    </div>
</div>
