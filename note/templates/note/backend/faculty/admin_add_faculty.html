<!-- Add Faculty Modal-->
<div class="modal fade" id="addFacultyModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
     aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="exampleModalLabel">Add Faculty</h5>
                <button class="close" type="button" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">×</span>
                </button>
            </div>
            <div class="modal-body">
                <form action="{% url 'adminAddFaculty' %}" method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    <input type="hidden" name="redirect_level_id" value="{{ level.id }}">
                    <div class="form-group">
                        <label for="Faculty Name">Faculty Name</label>
                        <select class="form-control my-select" data-show-subtext="true" data-live-search="true"
                                id="faculty_name"
                                name="faculty_name" required>

                            {% if level.level_name == 'Bachelor' %}
                                <option value="BSC/CSIT">BSC/CSIT</option>
                                <option value="BCA">BCA</option>
                                <option value="BIT">BIT</option>
                                <option value="BIT">BIM</option>
                                <option value="BBA">BBA</option>
                                <option value="BBS">BBS</option>
                                <option value="BSW">BSW</option>
                                <option value="BIM">BIM</option>
                                <option value="B.E Computer Science">B.E Computer Science</option>
                                <option value="B.E Civil Engineering">B.E Civil Engineering</option>


                            {% endif %}

                            {% if level.level_name == '+2|12' %}
                                <option value="+2|12 Science">+2|12 Science</option>
                                <option value="+2|12 Management">+2|12 Management</option>
                                <option value="+2|12 Humanities">+2|12 Humanities</option>

                            {% endif %}
                            {% if level.level_name == '+2|11' %}
                                <option value="+2|11 Science">+2|11 Science</option>
                                <option value="+2|11 Management">+2|11 Management</option>
                                <option value="+2|11 Humanities">+2|11 Humanities</option>
                            {% endif %}

                            {% if level.level_name == 'School' %}

                                <option value="class 10">class 10</option>
                                <option value="class 9">class 9</option>
                                <option value="class 8">class 8</option>
                                <option value="class 7">class 7</option>
                                <option value="class 6">class 6</option>
                                <option value="class 5">class 5</option>
                                <option value="class 4">class 4</option>
                                <option value="class 3">class 3</option>
                                <option value="class 2">class 2</option>
                                <option value="class 1">class 1</option>
                            {% endif %}


                        </select>
                    </div>

                    <div class="form-group">
                        <label for="faculty_description">Description</label>
                        <textarea name="faculty_description" class="form-control" id="faculty_description" rows="4"
                                  cols="50"></textarea>

                    </div>


                    <div class="form-group">
                        <label for="faculty_image">Choose Image</label><br>
                        <input type="file" name="faculty_image" id="faculty_image">
                    </div>

                    <div class="form-group">
                        <label for="Level Name">Select Level</label>

                        <select class="form-control my-select" data-show-subtext="true" data-live-search="true"
                                id="level_name"
                                name="level_name" required>


                            <option value="{{ level.id }}">{{ level.level_name }}</option>


                        </select>
                    </div>


                    <div class="modal-footer">
                        <button class="btn btn-secondary" type="button" data-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Add Faculty</button>
                    </div>
                </form>

            </div>

        </div>
    </div>
</div>
