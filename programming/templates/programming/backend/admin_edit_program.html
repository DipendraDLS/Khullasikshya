{% extends 'admin_home/admin_base.html' %}
{% load static %}

{% block body %}
    <div class="container-fluid">


        <!-- Programming Edit Table -->
        <div class="card shadow mb-4">
            <div class="card-header py-3">
                <a href="{% url 'programming' %}">
                    <button type="submit" class="btn btn-primary">Back</button>
                </a>
            </div>
            <div class="card-body">

                <form action="" method="POST">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="Blog Title">Programming Title</label>
                        {{ form.p_title }}
                    </div>
                    <div class="form-group">
                        <label for="Blog Content">Programming Link</label>
                        {{ form.media }}
                        {{ form.p_link }}

                    </div>

                    <div class="form-group">
                        <label for="Blog Content">Programming content</label><br>
                        {{ form.p_code }}
                    </div>

                    <div class="form-group">
                        <label>Choose Programming Language:</label>
                        <select class="form-control" data-show-subtext="true" data-live-search="true" id="p_language"
                                name="p_language" required>

                            {% for programming in language_types %}

                                <option value="{{ programming.id }}" >{{ programming.language_type }}</option>

                            {% endfor %}


                        </select>
                    </div>
                    <button type="submit" class="btn btn-success">Submit</button>
                </form>

            </div>
        </div>

    </div>



{% endblock %}
